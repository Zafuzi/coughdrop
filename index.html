<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Coughdrop</title>
		<link rel="stylesheet" href="./dist/coughdrop.css" />
	</head>
	<body>
		<header class="flex flow-column align-center justify-center bg-positive flex-fill padding-y-16">
			<h1>Coughdrop</h1>
			<p>An opinionated style library</p>

			<nav class="flex flow-row-wrap gap-8 align-center justify-space-around">
				<button class="button button-primary" id="toggle-theme">Switch Theme</button>
			</nav>
		</header>

		<main
			class="container-900 w-100 container-centered flex-fill flex flow-column bg-lighter gap-16 padding-16 align-stretch"
		>
			<article class="w-100 flex-fill flex flow-column align-stretch justify-center gap-16">
				<h2>Buttons</h2>
				<section class="flex flow-row-wrap gap-8">
					<button class="button button-primary">Primary</button>
					<button class="button button-secondary">Secondary</button>
					<button class="button button-danger">Danger</button>
				</section>
			</article>

			<article class="w-100 flex-fill flex flow-column align-stretch justify-center gap-16">
				<h2>Inputs</h2>

				<section class="grid col-1 gap-16">
					<label class="grid col-auto-fit align-center gap-8">
						Text Input
						<input name="text" class="input" type="text" placeholder="Text Input" />
					</label>
					<label class="grid col-auto-fit align-center gap-8">
						Number Input
						<input
							class="input"
							type="number"
							name="number"
							inputmode="numeric"
							placeholder="0"
							pattern="[0-9]*"
						/>
					</label>

					<label class="grid col-auto-fit align-center gap-8 slideContainer">
						Range Input
						<input class="slider" type="range" name="range" step="1" value="50" min="0" max="100" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						CheckBox Unchecked
						<div class="checkboxContainer">
							<input class="checkbox" type="checkbox" />
							<span class="checkmark"></span>
						</div>
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						CheckBox Checked
						<div class="checkboxContainer">
							<input class="checkbox" type="checkbox" checked />
							<span class="checkmark"></span>
						</div>
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Radio
						<fieldset class="flex flow-column gap-8">
							<label class="radioContainer">
								<input class="radio" type="radio" name="radio" checked />
								<span class="checkmark"></span>
								Radio 1
							</label>

							<label class="radioContainer">
								<input class="radio" type="radio" name="radio" />
								<span class="checkmark"></span>
								Radio 2
							</label>

							<label class="radioContainer">
								<input class="radio" type="radio" name="radio" />
								<span class="checkmark"></span>
								Radio 3
							</label>

							<label class="radioContainer">
								<input class="radio" type="radio" name="radio" />
								<span class="checkmark"></span>
								Radio 4
							</label>
						</fieldset>
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Color
						<input class="input" type="color" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Date
						<input class="input" type="date" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Datetime Local
						<input class="input" type="datetime-local" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Email
						<input class="input" type="email" placeholder="foobar@coughdrop.dev" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						File
						<input class="input" type="file" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Month
						<input class="input" type="month" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Password
						<input class="input" type="password" placeholder="password" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Search
						<input class="input" type="search" placeholder="Search" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Tel
						<input class="input" type="tel" placeholder="+1 123-456-7890" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Time
						<input class="input" type="time" />
					</label>

					<label class="grid col-auto-fit align-center gap-8">
						Week
						<input class="input" type="week" />
					</label>
				</section>
			</article>
		</main>

		<script src="./dist/theme-switcher.js"></script>
	</body>
</html>
